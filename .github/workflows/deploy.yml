name: Build and Push Docker Image

on:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repo name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # UMA base, UMA imagem: a `main` move `:latest`, que serve TODAS as instâncias (painel de
      # produção e demo) — o que muda entre elas é só env var (DATA_SOURCE/MODULOS), nunca o
      # código. Qualquer `feat/**` publica em `:teste`, para validar antes de mergear.
      # ⚠️ Não volte a criar tag por branch: foi assim que a produção ficou presa numa feature
      # branch e uma correção teve de ser cherry-picked entre duas linhas.
      - name: Definir tag conforme a branch
        id: tag
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "movel=latest" >> "$GITHUB_OUTPUT"
          else
            echo "movel=teste" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.tag.outputs.movel }}
            ghcr.io/${{ steps.repo.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
