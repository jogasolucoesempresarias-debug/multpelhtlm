<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOGA Analytics — Portal</title>
<link rel="icon" href="/static/joga-mark.svg">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e17; --surface: #111827; --surface2: #1a2235; --border: #1e293b;
    --text: #e2e8f0; --text-dim: #94a3b8; --accent: #38bdf8; --accent2: #818cf8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif;
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
  }
  .wrap { width: 100%; max-width: 720px; }
  .brand { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 6px; }
  .brand img { width: 38px; height: 38px; display: block; }
  .brand h1 { font-size: 1.3rem; font-weight: 700; }
  .sub { text-align: center; color: var(--text-dim); font-size: .86rem; margin-bottom: 30px; }
  .sub strong { color: var(--text); font-weight: 500; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 26px 22px; text-decoration: none; color: var(--text); display: block;
    transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card .ico {
    width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: var(--bg); font-size: 1.2rem; font-weight: 700; margin-bottom: 14px;
  }
  .card h2 { font-size: 1.02rem; font-weight: 700; margin-bottom: 6px; }
  .card p { font-size: .8rem; color: var(--text-dim); line-height: 1.5; }

  .fixar {
    margin-top: 22px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px;
  }
  .fixar label { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; font-size: .84rem; }
  .fixar input { margin-top: 2px; width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
  .fixar small { display: block; color: var(--text-dim); font-size: .74rem; margin-top: 3px; }
  .fixar .escolha { margin: 12px 0 0 25px; display: none; gap: 8px; }
  .fixar .escolha.on { display: flex; }
  .fixar .escolha button {
    padding: 6px 13px; border-radius: 7px; cursor: pointer; font-family: inherit; font-size: .78rem;
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  }
  .fixar .escolha button.on { border-color: var(--accent); color: var(--accent); }
  .status { margin-top: 10px; margin-left: 25px; font-size: .74rem; color: var(--accent); min-height: 14px; }

  .rodape { text-align: center; margin-top: 24px; }
  .rodape a { color: var(--text-dim); font-size: .78rem; text-decoration: none; }
  .rodape a:hover { color: var(--accent); }
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">
    <img src="/static/joga-mark.svg" alt="JOGA">
    <h1>JOGA Analytics</h1>
  </div>
  <div class="sub">Olá, <strong id="nome">—</strong>. Por onde você quer entrar?</div>

  <div class="cards" id="cards"></div>

  <div class="fixar">
    <label>
      <input type="checkbox" id="chkFixar">
      <span>
        Entrar sempre direto numa área
        <small>Pula esta tela nos próximos acessos. Dá pra voltar aqui pelo seletor no topo.</small>
      </span>
    </label>
    <div class="escolha" id="escolha">
      <button type="button" data-area="comercial">Comercial</button>
      <button type="button" data-area="compras">Compras</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="rodape"><a href="/logout">Sair da conta</a></div>
</div>

<script>
const AREAS = {
  comercial: { rotulo: 'Comercial', href: '/', ico: '📊',
               desc: 'Dashboard, carteira RFM, vendedores, categorias, metas e cobertura.' },
  compras:   { rotulo: 'Compras',   href: '/estoque/', ico: '📦',
               desc: 'Abastecimento, ruptura, validade, pedidos, orçamento e giro.' },
};
let areas = [], padraoAtual = 'portal';

function pintarCards() {
  document.getElementById('cards').innerHTML = areas.map(a => `
    <a class="card" href="${AREAS[a].href}">
      <div class="ico">${AREAS[a].ico}</div>
      <h2>${AREAS[a].rotulo}</h2>
      <p>${AREAS[a].desc}</p>
    </a>`).join('');
}

function pintarFixar() {
  const fixado = padraoAtual === 'comercial' || padraoAtual === 'compras';
  document.getElementById('chkFixar').checked = fixado;
  document.getElementById('escolha').classList.toggle('on', fixado);
  document.querySelectorAll('#escolha button').forEach(b => {
    b.classList.toggle('on', b.dataset.area === padraoAtual);
    b.style.display = areas.includes(b.dataset.area) ? '' : 'none';
  });
}

async function salvar(valor) {
  const el = document.getElementById('status');
  el.textContent = 'Salvando...';
  try {
    const r = await fetch('/api/me/area-padrao', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin', body: JSON.stringify({ area_padrao: valor }),
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'falhou');
    padraoAtual = valor;
    pintarFixar();
    el.textContent = valor === 'portal'
      ? 'Ok — esta tela volta a aparecer no login.'
      : `Ok — o login vai direto para ${AREAS[valor].rotulo}.`;
  } catch (e) {
    el.textContent = 'Não deu para salvar. Tente de novo.';
  }
}

document.getElementById('chkFixar').addEventListener('change', e => {
  if (e.target.checked) salvar(areas[0]);
  else salvar('portal');
});
document.querySelectorAll('#escolha button').forEach(b => {
  b.addEventListener('click', () => salvar(b.dataset.area));
});

fetch('/api/me', { credentials: 'same-origin' })
  .then(r => r.json())
  .then(me => {
    if (!me.ok) { location.href = '/login'; return; }
    document.getElementById('nome').textContent = me.nome || '—';
    areas = (me.areas || []).filter(a => AREAS[a]);
    padraoAtual = me.area_padrao || 'portal';
    // Uma área só não tem o que escolher — o servidor já manda direto pra ela.
    if (areas.length < 2) { location.href = AREAS[areas[0] || 'comercial'].href; return; }
    pintarCards();
    pintarFixar();
  })
  .catch(() => { location.href = '/login'; });
</script>
</body>
</html>
