<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>JOGA Analytics — Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/static/joga-mark.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/tema.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  body::before {
    content: ''; position: fixed; inset: 0; opacity: 0.03; pointer-events: none; z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 32px;
    width: 100%; max-width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    position: relative; z-index: 1;
    animation: fadeUp 0.4s ease;
  }
  .logo {
    width: 52px; height: 52px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; font-weight: 700; color: var(--bg);
    margin: 0 auto 18px;
  }
  h1 {
    font-size: 1.3rem; font-weight: 700; text-align: center; margin-bottom: 4px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { text-align: center; color: var(--text-dim); font-size: 0.82rem; margin-bottom: 26px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.72rem; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  .field input {
    width: 100%; padding: 10px 12px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text);
    font-family: inherit; font-size: 0.9rem;
    transition: border-color 0.15s;
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .btn-primary {
    width: 100%; padding: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: var(--bg); font-weight: 700; border: none; border-radius: 8px;
    cursor: pointer; font-size: 0.92rem; font-family: inherit;
    margin-top: 8px;
    transition: transform 0.1s;
  }
  .btn-primary:hover { transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .erro {
    background: rgba(248,113,113,0.1);
    border: 1px solid rgba(248,113,113,0.3);
    color: var(--red);
    padding: 9px 12px; border-radius: 8px;
    font-size: 0.82rem; margin-bottom: 14px;
    display: none;
  }
  .erro.show { display: block; }
  .footer { text-align: center; margin-top: 22px; color: var(--text-dim); font-size: 0.7rem; font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo" style="background:none;overflow:hidden"><img src="/static/joga-mark.svg" alt="JOGA" style="width:100%;height:100%;display:block"></div>
    <h1>JOGA Analytics</h1>
    <p class="subtitle">Painel comercial inteligente</p>

    <div id="erro" class="erro"></div>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autofocus autocomplete="username">
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary" id="btnLogin">Entrar</button>
    </form>

    <div class="footer">v0.1 · JOGA</div>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const erro = document.getElementById('erro');
  const btn = document.getElementById('btnLogin');

  function showError(msg) {
    erro.textContent = msg;
    erro.classList.add('show');
  }
  function clearError() {
    erro.classList.remove('show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();
    btn.disabled = true;
    btn.textContent = 'Entrando...';
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({
          email: document.getElementById('email').value,
          senha: document.getElementById('senha').value,
        })
      });
      const j = await r.json();
      if (j.ok) {
        window.location.href = j.redirect || '/';
      } else {
        showError(j.error || 'Erro ao autenticar');
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    } catch (err) {
      showError('Erro de conexão. Tente novamente.');
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>
