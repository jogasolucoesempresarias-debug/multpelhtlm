# ─────────────────────────────────────────────────────────────────────────────
# Stack DEMO — demo.jogasolucoes.com.br  (Portainer / Docker Swarm + Traefik)
#
# MESMA imagem da produção. A ÚNICA diferença é ENV: DATA_SOURCE=postgres → o app lê
# a base sintética `joga_demo`, NUNCA o Power BI do cliente. Um código, muitas instâncias.
#
# Auto-contido: traz o próprio Postgres (volume) + Redis + um serviço `demo-seed` que, no
# 1º deploy, MONTA a base sintética sozinho (idempotente — redeploys pulam). Nada na mão.
# Primeiro boot leva ~3–4 min (gera ~1,17M linhas). Depois é instantâneo.
#
# ⚠️ Usa a MESMA imagem `:latest` da produção — não existe imagem "de demo". O que faz esta
#    instância ser demo é o DATA_SOURCE=postgres abaixo. Login: ADMIN_EMAIL abaixo / admin123.
#
# 🔒 SEM POWERBI_* de propósito: a demo não tem como tocar o BI do cliente (defesa em
#    profundidade). SECRET_KEY e a senha do Postgres são exclusivas da demo (isoladas da produção).
# ─────────────────────────────────────────────────────────────────────────────
version: "3.8"

services:
  demo-app:
    image: ghcr.io/jogasolucoesempresarias-debug/multpelhtlm:latest
    networks:
      - proxy
      - demo-internal
    environment:
      FLASK_ENV: "production"
      TZ: "America/Sao_Paulo"
      SECRET_KEY: "95f0c08f955b3d6a5a4f65c8679a3668d147d629044d23c6474c711e92264fda"
      MODULOS: "comercial,compras"
      # >>> O INTERRUPTOR <<<  lê o banco sintético, não o Power BI
      DATA_SOURCE: "postgres"
      ANALYTICS_DB_NAME: "joga_demo"
      # analytics + auth vivem no MESMO banco joga_demo (tabelas não colidem)
      DB_HOST: "demo-postgres"
      DB_PORT: "5432"
      DB_NAME: "joga_demo"
      DB_USER: "demo"
      DB_PASSWORD: "3g3mF_I0yMbquxwgjjLGl2Ob8SB_PMfD"
      REDIS_HOST: "demo-redis"
      REDIS_PORT: "6379"
      CRON_HABILITADO: "false"
      # Admin semeado — sem o domínio do cliente na tela de login da apresentação.
      ADMIN_EMAIL: "admin@jogasolucoes.com.br"
      # Emitente do PDF de pedido de compra. Sem estas, o default do código é o cliente real —
      # é o único lugar da demo que ainda imprimiria dado dele. Fictício de propósito.
      EMPRESA_RAZAO: "ATACADO EXEMPLO DISTRIBUIDORA LTDA"
      EMPRESA_CNPJ: "12.345.678/0001-90"
      EMPRESA_IE: "123456789"
      EMPRESA_ENDERECO: "Av. das Nações, 1000"
      EMPRESA_BAIRRO: "Centro"
      EMPRESA_CEP: "00000-000"
      EMPRESA_CIDADE: "São Paulo"
      EMPRESA_UF: "SP"
      EMPRESA_TEL: "(11) 4000-0000"
      EMPRESA_EMAIL: "compras@exemplo.com.br"
      # (opcional) fixa o "hoje"; sem isto ancora sozinho no max(dtsaida) da base:
      # ANALYTICS_HOJE: "2026-07-24"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=proxy"
        - "traefik.http.routers.demo.rule=Host(`demo.jogasolucoes.com.br`)"
        - "traefik.http.routers.demo.entrypoints=websecure"
        - "traefik.http.routers.demo.tls.certresolver=le"
        - "traefik.http.services.demo.loadbalancer.server.port=5000"

  # Monta a base sintética no 1º deploy e sai (idempotente).
  demo-seed:
    image: ghcr.io/jogasolucoesempresarias-debug/multpelhtlm:latest
    command: ["bash", "_seed_demo/bootstrap_demo.sh"]
    # Job one-shot NÃO serve /health → o HEALTHCHECK herdado do Dockerfile marcava "unhealthy"
    # e o Swarm matava o seed (exit 137) no meio do fato. Desligar aqui.
    healthcheck:
      disable: true
    networks:
      - demo-internal
    environment:
      TZ: "America/Sao_Paulo"
      DB_HOST: "demo-postgres"
      DB_PORT: "5432"
      DB_NAME: "joga_demo"
      ANALYTICS_DB_NAME: "joga_demo"
      DB_USER: "demo"
      DB_PASSWORD: "3g3mF_I0yMbquxwgjjLGl2Ob8SB_PMfD"
      DEMO_SEED: "1"
      ADMIN_EMAIL: "admin@jogasolucoes.com.br"
      REDIS_HOST: "demo-redis"
      REDIS_PORT: "6379"
    deploy:
      replicas: 1
      restart_policy:
        condition: none

  demo-redis:
    image: redis:7-alpine
    networks:
      - demo-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  demo-postgres:
    image: postgres:16-alpine
    networks:
      - demo-internal
    environment:
      POSTGRES_DB: "joga_demo"
      POSTGRES_USER: "demo"
      POSTGRES_PASSWORD: "3g3mF_I0yMbquxwgjjLGl2Ob8SB_PMfD"
    volumes:
      - demo-pgdata:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  proxy:
    external: true
  demo-internal:
    driver: overlay

volumes:
  demo-pgdata:
